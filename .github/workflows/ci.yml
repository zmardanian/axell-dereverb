# Builds Axell De-Reverb on Linux (Ubuntu 24.04) and Windows (clang-cl), runs the test suites and pluginval on both, renders a
# fixed signal through the built VST3 on each (the independent AuditHost, as a DAW would load it) and checks Linux and
# Windows sound the same. The Windows VST3 is kept as an artifact. Least privilege: read-only token, no secrets,
# actions pinned to exact commits.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Full analysis: every sample rate, the CPU benchmark and the independent audit, on both systems"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System packages (Linux; the same list as scripts/setup-toolbox.sh)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config curl unzip xvfb \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target AxellDeReverb_VST3 DrDspTests DrPluginTests DrAuditHost -j4
          echo "BIN=build" >> "$GITHUB_ENV"; echo "EXE=" >> "$GITHUB_ENV"; echo "RUN=xvfb-run -a" >> "$GITHUB_ENV"
      - name: Configure and build (Windows, clang-cl)
        if: runner.os == 'Windows'
        run: |
          # clang-cl (LLVM, part of Visual Studio): measured 6-13 % less CPU than MSVC on the same runner
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL
          cmake --build build --config Release --target AxellDeReverb_VST3 DrDspTests DrPluginTests DrAuditHost -- -m
          echo "BIN=build/Release" >> "$GITHUB_ENV"; echo "EXE=.exe" >> "$GITHUB_ENV"; echo "RUN=" >> "$GITHUB_ENV"
      - name: DSP suite
        run: |
          mkdir -p reports
          if [ "${{ inputs.full }}" = "true" ]; then ARGS=""; else ARGS="--quick"; fi
          set +e; ./$BIN/DrDspTests$EXE $ARGS 2>&1 | tee reports/dsp-$RUNNER_OS.txt; rc=${PIPESTATUS[0]}; set -e
          if [ "$rc" != 0 ]; then
            # CPU budgets are set on the reference machine; a shared CI runner may miss them - a warning, not a failure
            if [ "${{ inputs.full }}" = "true" ] && ! grep -E "^ *FAIL" reports/dsp-$RUNNER_OS.txt | grep -qv "CPU"; then
              echo "::warning::only CPU budgets were missed on this shared runner (they are checked on the reference machine)"
            else exit "$rc"; fi
          fi
      - name: Plugin suite
        run: $RUN ./build/DrPluginTests_artefacts/Release/DrPluginTests$EXE 2>&1 | tee reports/plugin-$RUNNER_OS.txt
      - name: Windows crash details (only when a suite failed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include *DspTests.exe,*PluginTests.exe | Where-Object FullName -match 'Release' | ForEach-Object {
            Write-Host "== $($_.FullName)"
            $a = @(); if ($_.Name -match 'DspTests') { $a = '--quick' -split ' ' | Where-Object { $_ } }
            & $_.FullName @a 2>&1 | Select-Object -Last 25
            Write-Host ("exit code 0x{0:X8}" -f $LASTEXITCODE)
          }
      - name: pluginval (strictness 10)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then Z=pluginval_Windows.zip; S=.github/pluginval-windows.sha256; else Z=pluginval_Linux.zip; S=.github/pluginval.sha256; fi
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$Z"
          echo "$(cat $S)  pluginval.zip" | sha256sum -c
          unzip -o pluginval.zip
          $RUN ./pluginval$EXE --strictness-level 10 --validate-in-process \
            --validate "build/AxellDeReverb_artefacts/Release/VST3/Axell De-Reverb.vst3" 2>&1 | tee reports/pluginval-$RUNNER_OS.txt
      - name: Render the match signal through the built VST3
        run: |
          mkdir -p match
          python3 tools/xplat.py gen match/in.f32 || python tools/xplat.py gen match/in.f32
          printf 'rate 48000\nchannels 2\ninput match/in.f32\noutput match/default.f32\nrun\n' > match/job.txt
          $RUN ./build/DrAuditHost_artefacts/Release/DrAuditHost$EXE "build/AxellDeReverb_artefacts/Release/VST3/Axell De-Reverb.vst3" match/job.txt
      - name: Independent audit through the built VST3 (full analysis)
        if: inputs.full
        continue-on-error: true
        run: |
          PYB=$(command -v python3 || command -v python); "$PYB" -m venv venv
          PY=venv/bin/python; [ -x "$PY" ] || PY=venv/Scripts/python.exe
          "$PY" -m pip install --quiet numpy scipy
          HOST=$(find build -type f \( -name "DrAuditHost" -o -name "DrAuditHost.exe" \) -path "*Release*" | head -1)
          HOST="$PWD/$HOST"; VST3="$PWD/build/AxellDeReverb_artefacts/Release/VST3/Axell De-Reverb.vst3"
          if command -v cygpath >/dev/null; then HOST=$(cygpath -m "$HOST"); VST3=$(cygpath -m "$VST3"); fi   # native Windows paths for Python
          export AXELL_AUDIT_HOST="$HOST" AXELL_VST3="$VST3" PENTA_AUDIT_HOST="$HOST" PENTA_VST3="$VST3" DUO_AUDIT_HOST="$HOST" DUO_VST3="$VST3"
          $RUN $PY tests/independent/dr_audit.py 2>&1 | tee reports/audit-$RUNNER_OS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-${{ runner.os }}
          path: reports/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: match-${{ runner.os }}
          path: match/default.f32
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: AxellDeReverb-windows-vst3
          path: build/AxellDeReverb_artefacts/Release/VST3/
          retention-days: 30
  linux-windows-match:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: match-*
      - name: Linux and Windows renders match
        run: python3 tools/xplat.py compare match-Linux/default.f32 match-Windows/default.f32 -90
