version: 2
updates:
  # keeps the SHA-pinned GitHub Actions current (pull requests, never automatic merges)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7   # never propose a release younger than a week (time for a hijacked one to be caught)
    groups:
      actions:
        patterns: ["*"]
